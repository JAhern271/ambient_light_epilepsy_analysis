# Analysis parameters for the ambient light / epilepsy study.
#
# This file is the SINGLE SOURCE for every analysis parameter. doc/methods.md
# references these keys by name rather than restating their values, so a number
# exists in exactly one place. Three different night windows once existed across
# two documents and one call site; that is what this file prevents.
#
# Distinct from config.toml, which holds machine-specific data paths. Nothing
# here varies by machine, so this file is committed and identical everywhere.
#
# Changing a value here changes the analysis. Do it deliberately, record the
# decision in doc/analysis-log.md, and never change one after outcomes have been
# examined — the pre-specification in doc/methods.md is what licenses the
# analysis.
#
# WIRING STATUS 2026-09-03: read via ambient_light_epilepsy.params.
#   [cohort]    wired up, used by cohort.find_cases
#   [validity]  wired up, used by wear.py -- except min_valid_days and
#               min_wear_hours, which are recorded here but passed explicitly
#               by every caller on purpose (see that section)
#   [light]     day_window, night_window and primary_day_threshold wired up
#               2026-10-01, used by lux_metrics.compute_lux_summary.
#               day_thresholds is what lux_metrics.minutes_above_thresholds
#               takes, but no runner reads it yet. sensor_ceiling,
#               night_categories and iv_transform not yet used
#   [rest_activity]  min_window_coverage wired up 2026-10-01, used by
#               lux_metrics.compute_lux_summary -> relative_amplitude
#   everything else is still specification only.
# Migration is tracked in doc/implementation-status.md. Until it is closed,
# treat this file as normative and the literals as bugs.

[cohort]
# doc/methods.md 4.1, 4.3, 4.5
primary_cycle = "H"           # 2013-2014; the only cycle with reason-for-use codes
replication_cycle = "G"       # 2011-2012; broad definition only, reported separately
min_age = 20
# primary | narrow | broad | narrow_nocode -- see methods.md 4.1, 4.5
case_definition = "primary"
icd10_prefix = "G40"          # epilepsy and recurrent seizures

# Selection is CODE-FIRST: take everyone with icd10_prefix in RXDRSC1-3, then
# confirm the drug is an ASM. The name lists below are for confirmation and for
# the narrow/broad definitions -- never as the primary selector.
asm_confirm = [
    "phenytoin", "carbamazepine", "valproic acid", "divalproex sodium",
    "phenobarbital", "primidone", "ethosuximide", "levetiracetam",
    "lamotrigine", "topiramate", "oxcarbazepine", "zonisamide",
    "lacosamide", "clobazam", "clonazepam", "lorazepam", "diazepam",
    "gabapentin", "pregabalin",
]
# Drugs observed carrying a G40 code that are NOT antiseizure medications, and
# so are blanked (methods.md 4.1, following Terman 2020). This is the record of
# a manual review, not a filter: cohort.find_cases raises if a drug carries the
# code and appears on neither this list nor asm_confirm, so a new drug name
# forces a decision rather than being silently dropped.
#
# All three were reviewed on 2026-09-02 against the full prescription record:
#   allopurinol  gout drug, plainly a miscode -- that participant's record is
#                gout and diabetes, and their gabapentin is coded M79.2
#   hydrocodone  opioid; that participant also has a confirmed ASM with G40,
#                so only the row is blanked, not the person
#   alprazolam   RXDRSC1 is F41.9 (anxiety) with G40 secondary, alongside
#                citalopram; not a recognised ASM, unlike clonazepam,
#                lorazepam and diazepam, which are kept
non_asm_blanked = ["allopurinol", "alprazolam", "hydrocodone"]
# Rarely used off-label; the narrow definition (methods.md 4.1, sensitivity 2)
asm_narrow = ["levetiracetam", "phenytoin", "carbamazepine", "lacosamide"]
# The 12-name list behind the superseded results. Broad definition only.
asm_broad = [
    "phenytoin", "carbamazepine", "valproic acid", "divalproex sodium",
    "phenobarbital", "primidone", "ethosuximide", "levetiracetam",
    "lamotrigine", "topiramate", "oxcarbazepine", "zonisamide",
]

[validity]
# doc/methods.md 5.1, 5.2. Implemented by ambient_light_epilepsy.wear.
#
# SETTLED 2026-09-03 by the researcher, after the literature review reserved
# on 2026-09-02: D = 4 valid days, H = 20 hours, following Xiao 2023. There is
# no consensus rule -- methods.md 5.2 tabulates four published rules on these
# same data that differ materially, and Tang 2024 has none at all -- so this is
# a choice, and the sensitivity analyses below are how it is tested.
#
# The two values are recorded here but are deliberately NOT read as defaults.
# wear.py takes both as required arguments and scripts/build_validity.py
# requires them on the command line, so every run states the rule it applied,
# the sensitivity runs read identically to the primary one, and a provenance
# sidecar can never be ambiguous about which rule produced a file. That is by
# design and should not be "fixed"; see doc/analysis-log.md 2026-09-03.
#
# Never change either value now that outcomes are being produced against them.
min_valid_days = 4            # sensitivity: 5 (Johnson 2023), 3 (Su 2022)
min_wear_hours = 20           # per valid day; sensitivity: 16 (Su 2022)
day_boundary_hour = 12        # noon-to-noon days, so a night falls in one day
drop_partial_first_last = true    # first and last noon-to-noon day are partial
nonwear_pred_code = 3         # PAXPREDM: predicted non-wear. 2 (sleep) and 4
                              # (unknown, 3.3% of minutes) are KEPT, per 5.1
                              # -- settled 2026-09-03, not an open question
exclude_quality_flagged = true    # PAXQFM > 0, equivalently PAXFLGSM holding
                              # any letter. The two agree on all 88,223,479
                              # rows of PAXMIN_H; both are applied
uncomputable_mims = -0.01     # PAXMTSM sentinel for uncomputable (1,875 rows)

[light]
# doc/methods.md 6.1, 6.2, 6.3, 6.4
day_window = [7, 19]          # 07:00-19:00 inclusive of start, exclusive of end
night_window = [23, 6]        # 23:00-06:00, wraps midnight
# 19:00-23:00 and 06:00-07:00 are excluded from both, not assigned to either.
day_thresholds = [100, 250, 1000]   # lux; minutes per day above each
primary_day_threshold = 1000  # designated primary endpoint BEFORE analysis
# A masked minute inside the day window is not counted as above any threshold
# ("raw"), rather than the day's count being scaled up to the full window
# ("rescale"). Decided by the researcher 2026-10-01, before any light metric
# was computed on real data; see methods.md 6.2 and doc/analysis-log.md.
masked_minutes = "raw"
sensor_ceiling = 2500         # top-coded by the device; see methods.md 6.2
night_categories = 3          # none / low / high, split at median among exposed
iv_transform = "both"         # raw | log | both -- report both, methods.md 6.4

[rest_activity]
# doc/methods.md 6.5. M10, L5 and RA, used by lux_metrics.relative_amplitude on
# either signal (activity for the outcomes, lux for the light analogue of M10).
#
# A clock time masked on EVERY day leaves a NaN bin in the 24 h profile. A
# window's mean is taken over its non-NaN bins, and the window counts only if
# at least this fraction of its bins are non-NaN. 20/24 mirrors the valid-day
# rule (20 of 24 hours). TOML cannot write a fraction; this is the double that
# 20 / 24 evaluates to, and a test pins the two equal. 1.0 would reproduce the
# earlier behaviour of skipping any window that contains a NaN bin.
# Decided by the researcher 2026-10-01, before any rest-activity metric was
# computed on PAXMIN, when 0 of 4,085 eligible_H_primary_d04h20 participants
# had such a bin; see methods.md 6.5 and doc/analysis-log.md.
min_window_coverage = 0.8333333333333334

[sleep]
# doc/methods.md 6.6 -- secondary outcome family
algorithm = "ggir_vanhees"    # ggir_vanhees | thapa_chhetry | hmm
min_plausible_hours = 3
max_plausible_hours = 13

[matching]
# doc/methods.md 4.2, 8.1
method = "full"               # MatchIt method="full"; sensitivity: overlap, 4:1 caliper
variables = ["age", "sex", "race", "PIR", "education", "employment", "season"]
balance_smd_threshold = 0.1
seed = 42

[survey]
# doc/methods.md 8.5 -- supplementary analysis only
weight = "WTMEC2YR"
halve_weight = false          # true ONLY for a pooled 4-year sample; H alone is 2-year
strata = "SDMVSTRA"
psu = "SDMVPSU"

[multiplicity]
# doc/methods.md 8.6
correction = "fdr"
